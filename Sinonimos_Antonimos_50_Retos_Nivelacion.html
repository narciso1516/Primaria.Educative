<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión: Sinónimos y Antónimos — 50 retos</title>
<style>:root{--bg:#f5f7fb;--card:#fff;--text:#182033;--muted:#667085;--line:#dfe4ee;--accent:#3157c8;--accentbg:#eaf0ff;--ok:#eaf8ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}main{max-width:820px;margin:auto;padding:18px}.hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.hero{text-align:center;position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.sound,.next,.restart{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);font-weight:750;background:var(--accentbg);color:var(--text)}.emoji{font-size:64px;margin:8px}.kind{font-size:14px;font-weight:900}.word{font-size:38px;font-weight:950;margin-top:4px}.help{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.stat small{color:var(--muted)}.progress{height:10px;background:#e3e7ef;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--accent);width:2%;transition:width .25s}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.choice{min-height:62px;background:var(--card);border:2px solid var(--line);border-radius:15px;padding:12px;font-weight:800;color:var(--text)}.choice.good{background:var(--ok);border-color:#69b881}.choice:disabled{opacity:.55}.msg{min-height:60px;text-align:center;padding:16px;font-size:18px;font-weight:850}.actions{text-align:center}.next:disabled{opacity:.45}.confetti{position:absolute;inset:0;pointer-events:none}.piece{position:absolute;top:-30px;font-size:22px;animation:fall 1.2s ease-in forwards}.pop{animation:pop .3s}.shake{animation:shake .3s}.report{display:none;margin-top:15px}.report.show{display:block}.report h2{text-align:center}.report .big{text-align:center;font-size:56px}.reinforce{line-height:1.6}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@keyframes fall{to{transform:translateY(300px) rotate(520deg);opacity:.05}}@keyframes pop{50%{transform:scale(1.05)}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.word{font-size:32px}}</style></head>
<body><main id="game"><section class="hero" id="hero"><div class="confetti" id="confetti"></div><div class="top"><strong>📚 Curso de nivelación</strong><button class="sound" id="sound">🔊 Sonido: sí</button></div><div class="emoji" id="emoji">😊</div><div class="kind" id="kind"></div><div class="word" id="word"></div><div class="help" id="help"></div></section><section id="play"><div class="stats"><div class="stat"><small>RETO</small><br><b id="round">1/50</b></div><div class="stat"><small>ACIERTOS</small><br><b id="ok">0</b></div><div class="stat"><small>ERRORES</small><br><b id="bad">0</b></div><div class="stat"><small>RACHA</small><br><b id="streak">🔥 0</b></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="options" id="options"></div><div class="msg" id="msg" aria-live="polite">👆 Selecciona una respuesta</div><div class="actions"><button class="next" id="next" disabled>Siguiente reto →</button></div></section><section class="panel report" id="report"></section><footer>Actividad educativa · Sinónimos y Antónimos</footer></main>
<script>
const pairs=[['Feliz','Alegre','Triste','😊'],['Rápido','Veloz','Lento','🏃💨'],['Grande','Enorme','Pequeño','🐘'],['Bonito','Hermoso','Feo','🌸'],['Frío','Helado','Caliente','🥶'],['Fuerte','Robusto','Débil','💪'],['Cerca','Próximo','Lejos','📍'],['Limpio','Aseado','Sucio','✨'],['Comenzar','Iniciar','Terminar','🏁'],['Hablar','Conversar','Callar','🗣️'],['Subir','Ascender','Bajar','🪜'],['Claro','Luminoso','Oscuro','💡'],['Amable','Cordial','Grosero','🤝'],['Difícil','Complicado','Fácil','🧩'],['Comprar','Adquirir','Vender','🛍️'],['Entrar','Ingresar','Salir','🚪'],['Recordar','Rememorar','Olvidar','🧠'],['Valiente','Audaz','Cobarde','🦸'],['Silencioso','Callado','Ruidoso','🤫'],['Duro','Rígido','Blando','🪨'],['Vacío','Desocupado','Lleno','📦'],['Nuevo','Reciente','Viejo','🆕'],['Encender','Prender','Apagar','💡'],['Unir','Juntar','Separar','🧲'],['Aceptar','Admitir','Rechazar','✅'],['Ordenado','Organizado','Desordenado','🗂️'],['Generoso','Dadivoso','Egoísta','🎁'],['Divertido','Entretenido','Aburrido','🎉'],['Sencillo','Simple','Complejo','🧠'],['Contento','Satisfecho','Descontento','😄'],['Avanzar','Progresar','Retroceder','➡️'],['Construir','Edificar','Destruir','🏗️'],['Encontrar','Hallar','Perder','🔎'],['Preguntar','Interrogar','Responder','❓'],['Seco','Árido','Mojado','☀️'],['Ancho','Amplio','Estrecho','↔️'],['Alto','Elevado','Bajo','🏔️'],['Temprano','Pronto','Tarde','⏰'],['Encima','Arriba','Debajo','⬆️'],['Siempre','Constantemente','Nunca','♾️'],['Victoria','Triunfo','Derrota','🏆'],['Paz','Tranquilidad','Conflicto','🕊️'],['Rico','Sabroso','Insípido','😋'],['Inteligente','Listo','Torpe','🧠'],['Trabajador','Laborioso','Perezoso','🛠️'],['Risa','Carcajada','Llanto','😂'],['Amor','Cariño','Odio','❤️'],['Verdad','Certeza','Mentira','✔️'],['Alegría','Felicidad','Tristeza','🥳'],['Cuidar','Proteger','Descuidar','🛡️']];
const distract=['Camino','Ventana','Azul','Zapato','Mesa','Árbol','Nube','Libro','Pelota','Casa','Reloj','Escuela'];let i=0,ok=0,bad=0,streak=0,maxStreak=0,soundOn=true,answered=false;const details=[],$=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function tone(g){if(!soundOn)return;try{let A=window.AudioContext||window.webkitAudioContext,c=new A,o=c.createOscillator(),x=c.createGain();o.connect(x);x.connect(c.destination);o.frequency.value=g?700:190;x.gain.setValueAtTime(.08,c.currentTime);x.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function celebrate(){let b=$('confetti');b.innerHTML='';let z=['🎉','⭐','✨','🎊','🥳'];for(let n=0;n<22;n++){let s=document.createElement('span');s.className='piece';s.textContent=z[n%z.length];s.style.left=Math.random()*96+'%';s.style.animationDelay=Math.random()*.25+'s';b.appendChild(s)}setTimeout(()=>b.innerHTML='',1450)}
function render(){answered=false;let p=pairs[i],m=i%2?'ant':'syn',c=m==='syn'?p[1]:p[2],w=m==='syn'?p[2]:p[1];$('emoji').textContent=p[3];$('word').textContent=p[0].toUpperCase();$('kind').textContent=m==='syn'?'🔵 BUSCA EL SINÓNIMO':'🟠 BUSCA EL ANTÓNIMO';$('help').textContent=m==='syn'?'Elige la palabra que significa algo parecido.':'Elige la palabra que significa lo contrario.';$('round').textContent=(i+1)+'/50';$('bar').style.width=((i+1)/50*100)+'%';$('msg').textContent='👆 Selecciona una respuesta';$('next').disabled=true;let vals=shuffle([c,w,distract[i%distract.length],distract[(i+5)%distract.length]]);$('options').innerHTML='';vals.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(b,v,c,p[0]);$('options').appendChild(b)})}
function answer(btn,v,c,word){if(answered)return;if(v===c){answered=true;ok++;streak++;maxStreak=Math.max(maxStreak,streak);tone(true);celebrate();btn.classList.add('good','pop');$('msg').textContent=['🎉 ¡Felicidades! ¡Muy bien!','⭐ ¡Excelente respuesta!','🥳 ¡Correcto! Sigue así.'][ok%3];details.push({word,result:'Correcto'});$('next').disabled=false}else{bad++;streak=0;tone(false);btn.disabled=true;btn.classList.add('shake');$('msg').textContent='🤔 ¡Inténtalo de nuevo! Piensa en el significado.';details.push({word,result:'Error'})}update()}
function update(){$('ok').textContent=ok;$('bad').textContent=bad;$('streak').textContent='🔥 '+streak}
function finish(){tone(true);celebrate();$('hero').style.display='none';$('play').style.display='none';let pct=Math.round(ok/50*100),need=[...new Set(details.filter(x=>x.result==='Error').map(x=>x.word))],level=pct>=90?'🌟 ¡Excelente dominio!':pct>=70?'👏 ¡Muy buen trabajo!':'📚 Hay que seguir practicando.';$('report').classList.add('show');$('report').innerHTML=`<div class="big">🏆🎓🎉</div><h2>REPORTE FINAL</h2><p style="text-align:center">Sinónimos y antónimos · 50 retos</p><div class="stats"><div class="stat"><small>Aciertos</small><br><b>${ok}/50</b></div><div class="stat"><small>Intentos incorrectos</small><br><b>${bad}</b></div><div class="stat"><small>Resultado</small><br><b>${pct}%</b></div><div class="stat"><small>Mejor racha</small><br><b>🔥 ${maxStreak}</b></div></div><div class="panel reinforce"><b>${level}</b><p>${need.length?'Palabras que conviene reforzar: '+need.join(', ')+'.':'¡No quedaron palabras pendientes de reforzar!'}</p></div><br><button class="restart" id="restart">🔄 Volver a jugar</button>`;$('restart').onclick=restart}
function restart(){i=ok=bad=streak=maxStreak=0;details.length=0;update();$('report').classList.remove('show');$('report').innerHTML='';$('hero').style.display='block';$('play').style.display='block';render()}$('next').onclick=()=>{if(!answered)return;i<49?(i++,render()):finish()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sonido: sí':'🔇 Sonido: no'};render();
</script></body></html>
